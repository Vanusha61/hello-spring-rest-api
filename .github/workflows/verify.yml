name: Verify JDBC homework

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: messages_test
          POSTGRES_USER: messages
          POSTGRES_PASSWORD: messages
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U messages -d messages_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle build and H2 tests
        run: bash gradlew --no-daemon clean build
      - name: Maven and PostgreSQL tests
        run: mvn -B verify
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/messages_test
          TEST_DB_DRIVER: org.postgresql.Driver
          TEST_DB_USERNAME: messages
          TEST_DB_PASSWORD: messages
