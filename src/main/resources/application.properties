spring.application.name=java-jdbc-homework
server.port=${PORT:8080}
server.servlet.context-path=/api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/messages}
spring.datasource.username=${DB_USERNAME:messages}
spring.datasource.password=${DB_PASSWORD:messages}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
logging.level.org.springframework.jdbc.core=INFO
